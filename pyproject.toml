[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "blograg"
version = "0.0.0"
description = "A local MCP-oriented paragraph retriever for one Jekyll-style blog."
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "huruilizhen", email = "huruilizhen@gmail.com" },
]
requires-python = ">=3.11"
dependencies = [
  "labelrag>=0.1.1",
  "markdown-it-py>=3.0.0",
  "mcp>=1.27.0",
  "python-frontmatter>=1.1.0",
  "typer>=0.12.0",
]
keywords = ["rag", "mcp", "jekyll", "blog", "retrieval", "paragraphs"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/HuRuilizhen/blograg"
Repository = "https://github.com/HuRuilizhen/blograg"
Issues = "https://github.com/HuRuilizhen/blograg/issues"

[project.scripts]
blograg = "blograg.cli:app"

[project.optional-dependencies]
dev = [
  "build>=1.2.0",
  "pyright>=1.1.409",
  "pytest>=8.3.0",
  "ruff>=0.11.0",
  "twine>=6.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/blograg"]

[tool.hatch.build.targets.sdist]
only-include = [
  "/src/blograg",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
  "--strict-config",
  "--strict-markers",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["src", "tests", "typings"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = "none"
stubPath = "typings"
venvPath = "."
venv = ".venv"
